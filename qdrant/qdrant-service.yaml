apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qdrant-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ecomm
  labels:
    app: qdrant
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: qdrant

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ecomm
  labels:
    app: qdrant
spec:
  serviceName: qdrant
  replicas: 1

  selector:
    matchLabels:
      app: qdrant

  template:
    metadata:
      labels:
        app: qdrant

    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 6333
              protocol: TCP

            - name: grpc
              containerPort: 6334
              protocol: TCP

          env:
            - name: QDRANT__STORAGE__PERFORMANCE__MAX__SEARCH__THREADS
              value: "0"

          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage

  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: qdrant-gp3
        resources:
          requests:
            storage: 50Gi