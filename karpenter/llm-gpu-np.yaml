apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: llm-gpu-np
spec:
  template:
    metadata:
      labels:
        workload-type: llm-inference
      annotations:
        # Prevent voluntary disruption at the pod level as a second layer of defense
        karpenter.sh/do-not-disrupt: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: llm-gpu-nc
      expireAfter: 720h
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: topology.kubernetes.io/zone
          operator: In
          values: ["{fsx_az}"]

        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g5.2xlarge
            - g5.4xlarge
            - g6.2xlarge   # ← add as fallback
            - g6.4xlarge

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: workload-type
          operator: In
          values: ["llm-inference"]
      taints:
        - effect: NoSchedule
          key: nvidia.com/gpu
          value: "true"
  limits:
    cpu: "1000"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
    budgets:
      - nodes: "0"
    
