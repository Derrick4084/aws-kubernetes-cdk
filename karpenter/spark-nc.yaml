apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-nc
spec:

  role: "{role_name}"

  amiSelectorTerms:
    - alias: al2023@latest  # Or a specialized Deep Learning AMI/GPU-enabled alias

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{cluster_name}"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{cluster_name}"
        
  tags:
    karpenter.sh/discovery: "{cluster_name}"
    workload-type: spark

  userData: |
    #!/bin/bash
    dnf install -y kmod-lustre-client lustre-client
    depmod -a
    modprobe lustre


    
      