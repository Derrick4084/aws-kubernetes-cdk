apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: embeddings-nodepool
spec:
  template:
    metadata:
      labels:
        workload-type: embeddings
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: embeddings-nodeclass
      expireAfter: 720h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m7i", "m7a", "c7i", "c7a"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large"]

  limits:
    cpu: "500"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m