apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: llm-gpu-nc
spec:

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2      # ← Allows userData scripts to reach IMDS
    httpTokens: required

  role: "{role_name}"
  # role: "KarpenterNodeRole-eks-spark-llm"

  
  amiSelectorTerms:
    - alias: al2023@latest  # Or a specialized Deep Learning AMI/GPU-enabled alias
  
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{cluster_name}"
        # karpenter.sh/discovery: "eks-spark-llm"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{cluster_name}"

  tags:
    karpenter.sh/discovery: "{cluster_name}"
    workload-type: llm-inference

  userData: |
    #!/bin/bash
    dnf install -y kmod-lustre-client lustre-client
    depmod -a
    modprobe lustre
  
