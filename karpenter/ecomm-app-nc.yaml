
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ecomm-general
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: {role_name}

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {clustername}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {clustername}

  tags:
    workload: ecomm-general
    managed-by: karpenter


    
      