
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ecomm-nodepool
spec:
  template:
    metadata:
      labels:
        workload-type: general-purpose
        workload-group: ecomm-services

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ecomm-general
        
      expireAfter: 720h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["6"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]

  limits:
    cpu: "32"
    memory: 128Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m





