apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: embeddings-nodeclass
spec:
  role: {role_name}

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {clustername}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {clustername}

  tags:
    karpenter.sh/discovery: {clustername}
    workload-type: embeddings