apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zipkin-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"

---

apiVersion: v1
kind: Service
metadata:
  name: zipkin-headless
  namespace: ecomm
  labels:
    apps: zipkin
spec:
  clusterIP: None
  ports:
  - port: 9411
    targetPort: http
    name: zipkin-http
  selector:
    app: zipkin

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zipkin
  namespace: ecomm
  labels: 
    app: zipkin
spec:
  replicas: 1
  serviceName: zipkin-headless
  selector:
    matchLabels:
      app: zipkin  
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin
        ports:
        - containerPort: 9411
          name: zipkin-http
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests: 
            cpu: "1"
            memory: 4Gi
        volumeMounts:
        - name: zipkin-storage
          mountPath: /zipkin/storage
volumeClaimTemplates:
- metadata:
    name: zipkin-storage
  spec:
    accessMode: ["readWriteOnce"]
    storageClassName: "zipkin-gp3"
    resources:
      requests:
        storage: 50Gi











        
