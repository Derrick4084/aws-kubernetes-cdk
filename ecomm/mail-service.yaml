apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: ecomm
  labels:
    app: mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      containers:
        - name: mail
          image: maildev/maildev
          imagePullPolicy: Always

          ports:
            - name: mail-http
              containerPort: 1080
              protocol: TCP
            - name: mail-smtp
              containerPort: 1025
              protocol: TCP

          env:
            
            - name: MAILDEV_SMTP_PORT
              value: "1025"

            - name: MAILDEV_WEB_PORT
              value: "1080"

            - name: MAILDEV_INCOMING_USER
              value: "mailuser"

            - name: MAILDEV_INCOMING_PASS
              value: "mailpassword"

            - name: MAILDEV_HOST
              value: "mail.ecomm.svc.cluster.local"

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: mail-svc
  namespace: ecomm
  labels:
    app: mail
spec:
  selector:
    app: mail
  clusterIP: None
  ports:
    - name: mail-http
      port: 1080
      targetPort: 1080
      protocol: TCP
    - name: mail-smtp
      port: 1025
      targetPort: 1025
      protocol: TCP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-ingress
  namespace: ecomm
  annotations:
    alb.ingress.kubernetes.io/group.name: ecomm-ingress-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /mail
            pathType: Prefix
            backend:
              service:
                name: mail-svc
                port:
                  number: 1080