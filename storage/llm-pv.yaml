apiVersion: v1
kind: PersistentVolume
metadata:
  name: fsx-lustre-model-pv
spec:
  capacity:
    storage: 1200Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  csi:
    driver: fsx.csi.aws.com
    volumeHandle: "{fsx_id}"
    volumeAttributes:
      dnsname: "{fsx_dns_name}"
      mountname: "{fsx_mount_name}"

