apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: llm-gpu-nodepool
spec:
  nodeClassRef:
    group: karpenter.k8s.aws
    kind: EC2NodeClass
    name: llm-gpu-nodeclass
  template:
    metadata:
      labels:
        workload-type: llm-inference
    spec:
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: Gt
          values: ["0"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g4dn"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      taints:
        - effect: NoSchedule
          key: nvidia.com/gpu
          value: "true"
  limits:
    cpu: "1000"
    nvidia.com/gpu: "10"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    expireAfter: 720h
