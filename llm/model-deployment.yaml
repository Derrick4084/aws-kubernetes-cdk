apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-app
  namespace: ecomm
  labels:
    app: vllm-inference-app 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference-app
  template:
    metadata:
      labels:
        app: vllm-inference-app     
    spec:
      serviceAccountName: model-storage
      nodeSelector:
        workload-type: llm-inference
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule 
      initContainers:
      - name: wait-for-model-download
        image: public.ecr.aws/docker/library/busybox:1.36
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            until [ -f /model-cache/models/download/.llama-download-complete ]; do
              echo "Waiting for LLM model download to complete..."
              sleep 10
            done
            echo "LLM model download completed."
        volumeMounts:
          - name: model-cache
            mountPath: /model-cache
      containers:
      - name: vllm-inference
        image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]     
        ports:
        - containerPort: 8081
        env:
        - name: HF_HOME
          value: "/model-cache/cache"
        - name: TRANSFORMERS_CACHE
          value: "/model-cache/cache"
        - name: TRITON_CACHE_DIR
          value: "/model-cache/cache/triton"
        - name: VLLM_CACHE_ROOT
          value: "/model-cache/cache/vllm"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        args:
        - "--model=/model-cache/models/Llama-3.1-8B-Instruct"
        - "--host=0.0.0.0"
        - "--port=8081"
        - "--tensor-parallel-size=1"
        - "--gpu-memory-utilization=0.9"
        - "--max-model-len=4096"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=llama3_json"
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: dshm
          mountPath: /dev/shm          
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "24Gi"
          requests:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"       
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llm-model-store-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: ecomm
  labels:
    app: vllm-inference-app
spec:
  type: ClusterIP
  selector:
    app: vllm-inference-app
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
