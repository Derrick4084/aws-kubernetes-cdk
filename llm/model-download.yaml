apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: ecomm
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-storage
      containers:
      - name: downloader
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
        - |          
          set -e

          pip install -q huggingface_hub boto3

          python3 << 'PYTHON'
          import os
          import json
          import boto3
          from pathlib import Path
          from huggingface_hub import list_repo_files, hf_hub_download

          bucket = os.environ["MODEL_BUCKET"]
          repo_id = "meta-llama/Llama-3.1-8B-Instruct"

          sm = boto3.client("secretsmanager")
          secret = sm.get_secret_value(SecretId="hugging-face")
          hf_token = json.loads(secret["SecretString"])["apikey"]

          s3 = boto3.client("s3")

          patterns = (".json", ".txt", ".md", ".safetensors", ".model")
          files = [f for f in list_repo_files(repo_id, token=hf_token) if f.endswith(patterns)]

          for filename in files:
              print(f"Streaming {{filename}} to S3...")
              local_path = hf_hub_download(repo_id=repo_id, filename=filename, token=hf_token)
              s3_key = f"models/Llama-3.1-8B-Instruct/{{filename}}"
              with open(local_path, "rb") as f:
                  s3.upload_fileobj(f, bucket, s3_key)
              os.remove(local_path)

          marker_key = "models/Llama-3.1-8B-Instruct/.llama-download-complete"

          s3.put_object(
              Bucket=bucket,
              Key=marker_key,
              Body=b"complete",
          )

          print("Llama model upload complete!")
          PYTHON

        env:
        - name: MODEL_BUCKET
          value: "{model_bucket}"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
            ephemeral-storage: "20Gi"
          limits:
            memory: "4Gi"
            cpu: "2"
            ephemeral-storage: "20Gi"
     