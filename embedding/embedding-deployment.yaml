apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-app
  namespace: ecomm
  labels:
    app: embedding-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-app
  template:
    metadata:
      labels:
        app: embedding-app       
    spec:
      serviceAccountName: model-storage    
      nodeSelector:
        karpenter.sh/nodepool: embeddings-nodepool
      initContainers:
        - name: wait-for-embeddings-download
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until [ -f /model-cache/embeddings/download/.embeddings-download-complete ]; do
                echo "Waiting for Embeddings model download to complete..."
                sleep 10
              done
              echo "Embeddings model download completed."
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: llm-model-store-pvc
      containers:
      - name: embedding-server
        image: ghcr.io/ggml-org/llama.cpp:server
        imagePullPolicy: IfNotPresent
        command: ["/app/llama-server"]     
        args:
          - "-m"
          - "/model-cache/embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf"
          - "--alias"
          - "nomic-embed"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8082"
          - "--embedding"
          - "-t"
          - "2"
          - "-tb"
          - "2"
          - "-n"
          - "512"
        ports:
        - containerPort: 8082       
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: dshm
          mountPath: /dev/shm   
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"        
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llm-model-store-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: embed-svc
  namespace: ecomm
  labels:
    app: embedding-app
spec:
  type: ClusterIP
  selector:
    app: embedding-app
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
