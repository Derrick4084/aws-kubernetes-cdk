apiVersion: batch/v1
kind: Job
metadata:
  name: embedding-download
  namespace: default
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400

  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-storage-sa

      containers:
        - name: downloader
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              pip install -q huggingface_hub boto3

              echo "Downloading nomic-embed-text..."

              python3 << 'PYTHON'
              import os
              import boto3
              from pathlib import Path
              from huggingface_hub import hf_hub_download

              bucket = os.environ["MODEL_BUCKET"]

              local_dir = Path("/tmp/nomic")
              local_dir.mkdir(parents=True, exist_ok=True)

              file_path = hf_hub_download(
                  repo_id="nomic-ai/nomic-embed-text-v1.5-GGUF",
                  filename="nomic-embed-text-v1.5.Q4_K_M.gguf",
                  local_dir=str(local_dir),
                  token=os.environ["HF_TOKEN"],
              )

              print(f"Downloaded: {file_path}")

              s3 = boto3.client("s3")

              s3_key = "embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf"

              print(f"Uploading to s3://{bucket}/{s3_key}")

              s3.upload_file(
                  file_path,
                  bucket,
                  s3_key
              )

              print("Upload complete!")
              PYTHON

          env:
            - name: MODEL_BUCKET
              value: "{model_bucket}"

            - name: HF_HUB_DISABLE_XET
              value: "1"

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-secret
                  key: token

          resources:
            requests:
              memory: "2Gi"
              cpu: "1"

            limits:
              memory: "4Gi"
              cpu: "2"