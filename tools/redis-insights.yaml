apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: tools
  labels:
    apps: redis-insight
spec:
  clusterIP: None 
  ports:
  - port: 5540
    targetPort: http
    name: redis-insight-http
  selector:
    app: redis-insight

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-insight
  labels: 
    app: redis-insight
spec:
  replicas: 1
  serviceName: redis-insight-svc
  selector:
    matchLabels:
      app: redis-insight  
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
      - name: redis-insight
        image: redis/redisinsight:latest
        ports:
        - containerPort: 5540
          name: redis-insight-http
        env:
        - name: RI_REDIS_HOST
          value: "{redis_host}"
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests: 
            cpu: "1"
            memory: 4Gi
        volumeMounts:
        - name: redis-insight-storage
          mountPath: /redis/insight
volumeClaimTemplates:
- metadata:
    name: redis-insight-storage
  spec:
    accessModes: ["readWriteOnce"]
    storageClassName: "tools-gp3"
    resources:
      requests:
        storage: 50Gi











        
